name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test DatasetCropper.sln --configuration Release

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish src/DatasetCropper/DatasetCropper.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:Version=${{ steps.version.outputs.value }}

      - name: Package release archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/DatasetCropper-win-x64.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/DatasetCropper-win-x64.zip --title "DatasetCropper ${{ github.ref_name }}" --generate-notes